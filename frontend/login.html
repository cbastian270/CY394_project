<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CadetCoin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1f2937, #111827);
      color: #fff;
    }

    .login-container {
      background: #ffffff;
      color: #222;
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .login-container h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #111827;
    }

    .login-container p.subtitle {
      text-align: center;
      margin-bottom: 25px;
      color: #6b7280;
      font-size: 14px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:active {
      transform: scale(0.98);
    }

    #errorMessage {
      margin-top: 15px;
      text-align: center;
      color: #dc2626;
      font-size: 14px;
      min-height: 20px;
    }

    .brand {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #10b981;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand">CadetCoin</div>
    <h1>Login</h1>
    <p class="subtitle">For help, contact MAJ Haskins at joshua.haskins2@westpoint.edu</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="firstname.lastname" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter your assigned ID" required>

      <button type="submit">Login</button>
      

    </form>

    <p id="errorMessage"></p>
  </div>

  <script src="login.js"></script>
</body>
</html>
